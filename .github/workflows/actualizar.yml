name: Actualizar desplazamientos

# Solo se ejecuta a mano: pestaña Actions > "Actualizar desplazamientos" > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/actualizar.py
      - name: Commit si hay cambios
        run: |
          if [ -n "$(git status --porcelain desplazamientos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add desplazamientos.json
            git commit -m "datos: actualizar desplazamientos"
            git push
          else
            echo "Sin cambios que publicar."
          fi
